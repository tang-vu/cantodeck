name: Feature request
description: Suggest a focused improvement.
title: "[Feature]: "
body:
  - type: textarea
    id: need
    attributes:
      label: User problem
      description: "What cannot you accomplish today? Check docs/ROADMAP.md first."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior and alternatives
    validations:
      required: true
